<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="700" viewBox="0 0 1728 700" font-family="Calibri, Arial, sans-serif">
  <title>Architecture of the calculator for the presentation slide</title>
  <desc>The user acts on the interface layer (index.html, styles.css, keymap.js, app.js). app.js passes key names and states to the calculation layer (engine.js, format.js) and receives new states and display text. The calculation layer never touches the page.</desc>
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#374151"/></marker>
  </defs>
  <rect width="1728" height="700" fill="#FFFFFF"/>
  <!-- user -->
  <rect x="20" y="270" width="190" height="90" rx="45" fill="#DCE6FB" stroke="#1D4ED8" stroke-width="3"/>
  <text x="115" y="327" font-size="40" font-weight="700" text-anchor="middle" fill="#111827">User</text>
  <line x1="212" y1="315" x2="288" y2="315" stroke="#374151" stroke-width="4" marker-end="url(#a)"/>
  <text x="115" y="408" font-size="28" text-anchor="middle" fill="#374151">click or</text>
  <text x="115" y="442" font-size="28" text-anchor="middle" fill="#374151">key press</text>
  <!-- interface layer -->
  <rect x="290" y="30" width="710" height="570" rx="24" fill="#F3F5F9" stroke="#9AA3B5" stroke-width="3"/>
  <text x="320" y="82" font-size="38" font-weight="700" fill="#111827">Interface layer</text>
  <text x="320" y="122" font-size="28" fill="#374151">knows the web page</text>
  <g stroke="#1D4ED8" stroke-width="3" fill="#DCE6FB">
    <rect x="315" y="170" width="320" height="170" rx="14"/>
    <rect x="660" y="170" width="320" height="170" rx="14"/>
    <rect x="315" y="380" width="320" height="170" rx="14"/>
    <rect x="660" y="380" width="320" height="170" rx="14"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="475" y="235" font-size="38" font-weight="700">index.html</text><text x="475" y="282" font-size="28">buttons, display</text>
    <text x="820" y="235" font-size="38" font-weight="700">styles.css</text><text x="820" y="282" font-size="28">look and layout</text>
    <text x="475" y="445" font-size="38" font-weight="700">keymap.js</text><text x="475" y="492" font-size="28">key to key name</text>
    <text x="820" y="445" font-size="38" font-weight="700">app.js</text><text x="820" y="485" font-size="28">connects the page</text><text x="820" y="520" font-size="28">and the calculator</text>
  </g>
  <!-- calculation layer -->
  <rect x="1190" y="30" width="520" height="570" rx="24" fill="#F3F5F9" stroke="#9AA3B5" stroke-width="3"/>
  <text x="1220" y="82" font-size="38" font-weight="700" fill="#111827">Calculation layer</text>
  <text x="1220" y="122" font-size="28" fill="#374151">never touches the page</text>
  <g stroke="#1D4ED8" stroke-width="3" fill="#DCE6FB">
    <rect x="1215" y="170" width="470" height="170" rx="14"/>
    <rect x="1215" y="380" width="470" height="170" rx="14"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="1450" y="235" font-size="38" font-weight="700">engine.js</text><text x="1450" y="282" font-size="28">state and rules</text>
    <text x="1450" y="445" font-size="38" font-weight="700">format.js</text><text x="1450" y="492" font-size="28">number to display text</text>
  </g>
  <!-- arrows between the layers -->
  <g stroke="#374151" stroke-width="4" fill="none">
    <line x1="1004" y1="250" x2="1186" y2="250" marker-end="url(#a)"/>
    <line x1="1186" y1="310" x2="1004" y2="310" marker-end="url(#a)"/>
    <line x1="1004" y1="460" x2="1186" y2="460" marker-end="url(#a)"/>
    <line x1="1186" y1="520" x2="1004" y2="520" marker-end="url(#a)"/>
  </g>
  <g font-size="26" text-anchor="middle" fill="#374151">
    <text x="1095" y="232">key name</text>
    <text x="1095" y="296">new state</text>
    <text x="1095" y="442">state</text>
    <text x="1095" y="506">display text</text>
  </g>
  <text x="864" y="660" font-size="28" text-anchor="middle" fill="#374151">The rules can be tested from the command line, with no browser.</text>
</svg>
